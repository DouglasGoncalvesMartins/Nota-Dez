<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotaDez - Conectando Alunos, Transformando Notas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2b7a78;
            text-decoration: none;
        }

        .logo span {
            color: #feffff;
            background-color: #3aafa9;
            padding: 2px 8px;
            border-radius: 5px;
            margin-left: 4px;
        }

        .menu-btn {
            display: none;
            background: none;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 20px;
            cursor: pointer;
            color: #17252a;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        nav ul li a {
            text-decoration: none;
            color: #17252a;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #3aafa9;
        }

        .hero {
            background: linear-gradient(135deg, #3aafa9 0%, #2b7a78 100%);
            color: white;
            text-align: center;
            padding: 90px 20px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .btn-cta {
            background-color: #feffff;
            color: #2b7a78;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn-cta:hover {
            transform: translateY(-3px);
            background-color: #e5e5e5;
        }

        .secao {
            padding: 65px 0;
            text-align: center;
        }

        .secao-titulo {
            font-size: 32px;
            color: #17252a;
            margin-bottom: 12px;
        }

        .secao-subtitulo {
            color: #555;
            max-width: 620px;
            margin: 0 auto 40px;
        }

        .grid-vantagens {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #3aafa9;
            transition: transform 0.25s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card h3 {
            margin-bottom: 12px;
            color: #2b7a78;
            font-size: 22px;
        }

        .como-funciona {
            background-color: #ffffff;
        }

        .grid-passos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .passo {
            padding: 25px 20px;
            border-radius: 10px;
            background-color: #f4f7f6;
            border: 1px solid #e0eceb;
        }

        .passo-numero {
            width: 42px;
            height: 42px;
            background-color: #3aafa9;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .passo h3 {
            color: #17252a;
            margin-bottom: 8px;
            font-size: 19px;
        }

        .grid-materias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .materia-card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .materia-card h3 {
            color: #2b7a78;
            font-size: 20px;
        }

        .materia-card p {
            font-size: 14px;
            color: #555;
        }

        .btn-materia {
            background-color: #def2f1;
            color: #2b7a78;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-materia:hover {
            background-color: #3aafa9;
            color: white;
        }

        .estatisticas {
            background-color: #17252a;
            color: white;
            padding: 50px 0;
            text-align: center;
        }

        .grid-dados {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
        }

        .dado h4 {
            font-size: 36px;
            color: #3aafa9;
        }

        .faq-lista {
            max-width: 760px;
            margin: 0 auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .faq-item {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .faq-pergunta {
            width: 100%;
            background: none;
            border: none;
            padding: 18px 20px;
            text-align: left;
            font-size: 16px;
            font-weight: 600;
            color: #17252a;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .faq-pergunta:hover {
            color: #2b7a78;
        }

        .faq-resposta {
            display: none;
            padding: 0 20px 18px;
            color: #555;
            font-size: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .faq-item.aberto .faq-resposta {
            display: block;
            padding-top: 12px;
        }

        .modal-fundo {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 200;
        }

        .modal-fundo.ativo {
            display: flex;
        }

        .modal-caixa {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .modal-topo h3 {
            color: #2b7a78;
        }

        .fechar-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .campo {
            margin-bottom: 15px;
            text-align: left;
        }

        .campo label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .campo input, .campo select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn-enviar {
            width: 100%;
            background-color: #3aafa9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-enviar:hover {
            background-color: #2b7a78;
        }

        .alerta-sucesso {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: #d1e7dd;
            color: #0f5132;
            border-radius: 6px;
            font-size: 14px;
        }

        footer {
            background-color: #def2f1;
            color: #17252a;
            text-align: center;
            padding: 24px 20px;
            font-size: 14px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }

                width: 100%;
